name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project dependencies and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install faker pandas "psycopg[binary]" pytest ruff

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: pytest