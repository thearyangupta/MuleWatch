name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: mulewatch_test
          POSTGRES_USER: mulewatch
          POSTGRES_PASSWORD: mulewatch_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mulewatch -d mulewatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      MULEWATCH_DATABASE_URL: postgresql://mulewatch:mulewatch_dev@localhost:5432/mulewatch_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project dependencies and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install faker pandas "psycopg[binary]" scikit-learn xgboost mlflow fastapi httpx pytest ruff pyyaml sentence-transformers pgvector requests beautifulsoup4

      - name: Create test database schema and read-only role
        env:
          PGPASSWORD: mulewatch_dev
        run: |
          psql -h localhost -U mulewatch -d mulewatch_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -h localhost -U mulewatch -d mulewatch_test -f db/schema.sql
          psql -h localhost -U mulewatch -d mulewatch_test -f db/roles.sql

      - name: Build typology knowledge base
        run: python rag/ingest.py

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: pytest --ignore=tests/test_dag_integrity.py

      - name: Build Airflow test image
        run: |
          docker build -f airflow/Dockerfile -t mulewatch-airflow-test .

      - name: Run DAG integrity test
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/opt/airflow/project" \
            -w /opt/airflow/project \
            -e PYTHONPATH=/opt/airflow/project \
            mulewatch-airflow-test \
            pytest tests/test_dag_integrity.py -v