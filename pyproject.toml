[project]
name = "mulewatch"
version = "0.1.0"
description = "AI investigation copilot for money-mule alerts"
requires-python = ">=3.14"

dependencies = [
    "faker",
    "pandas",
    "pandera[pandas]",
    "psycopg[binary]",
    "scikit-learn",
    "xgboost",
    "mlflow",
    "fastapi",
    "PyJWT>=2.9,<3",
    "pwdlib[argon2]>=0.2,<1",
    "python-multipart>=0.0.20,<1",
    "uvicorn",
    "httpx",
    "presidio-analyzer",
    "presidio-anonymizer",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "langfuse>=4,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "api*", "scoring*", "pipeline*", "rag*"]
namespaces = true